# Publishes bopsy-site to GitHub Pages (D116 adjusted): the landing, the
# legal pages and the web app built from app/ under /app/.
# The app is built in live mode when the three repository variables
# VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY and VITE_REVENUECAT_WEB_KEY are set
# (Settings > Secrets and variables > Actions > Variables), in demo mode when
# none is; VITE_TURNSTILE_SITE_KEY is optional (D143). They are public keys
# (anon or publishable key, RevenueCat Web Billing public key, Turnstile site
# key); the build refuses a secret key, and fails when only some are set.
# In live mode the legal pages must have no blank left: LEGAL_NAME,
# LEGAL_ADDRESS, LEGAL_SIREN, SUPPORT_EMAIL and CONSUMER_MEDIATOR variables
# (scripts/fill-legal.mjs).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci

      - name: Unit tests
        working-directory: app
        run: npm test

      - name: Build the web app (live with the three variables, demo with none)
        working-directory: app
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          # The production key may be kept as a repository secret; it wins over the variable.
          VITE_REVENUECAT_WEB_KEY: ${{ secrets.VITE_REVENUECAT_WEB_KEY || vars.VITE_REVENUECAT_WEB_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
        run: |
          npm run build
          npm run size

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html style.css CNAME _site/
          # Domain checks served from the root of bopsyia.com (Apple Pay merchant domain, D142).
          # To check once the file exists: upload-pages-artifact may leave hidden folders out.
          if [ -d .well-known ]; then cp -r .well-known _site/; fi
          # fr/: the French legal pages (fr/privacy, fr/terms, fr/support, fr/delete-data, fr/legal).
          # assets/: fonts, icons, og.jpg and wall/ (the muted clips and posters of the landing's first screen).
          cp -r assets privacy terms support delete-data legal fr _site/
          cp -r app/dist _site/app

      - name: Publisher details in the legal pages (repository variables, D140)
        env:
          LEGAL_NAME: ${{ vars.LEGAL_NAME }}
          LEGAL_ADDRESS: ${{ vars.LEGAL_ADDRESS }}
          LEGAL_SIREN: ${{ vars.LEGAL_SIREN }}
          SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
          CONSUMER_MEDIATOR: ${{ vars.CONSUMER_MEDIATOR }}
        run: node scripts/fill-legal.mjs _site ${{ vars.VITE_SUPABASE_URL != '' && '--strict' || '' }}

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
